name: Instagram の投稿を確認

# 最近の投稿が Instagram 上にあるか、API に問い合わせて確かめる（投稿はしない）。
# 結果は Actions の画面の「Annotations」に出るので、GitHub にログインしなくても見られる。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 最近の投稿を問い合わせる
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          API = "https://graph.instagram.com/v23.0"
          token = os.environ["IG_ACCESS_TOKEN"].strip()

          def get(path, **params):
              params["access_token"] = token
              url = f"{API}/{path}?{urllib.parse.urlencode(params)}"
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:500]}

          def notice(text):
              print("::notice::" + text.replace("%", "%25").replace("\n", "%0A"), flush=True)

          me = get("me", fields="username,media_count")
          notice(f"アカウント: {me.get('username')}　Instagram 上の投稿数: {me.get('media_count')}　{me.get('error', '')}")

          recent = get(f"{os.environ['IG_USER_ID'].strip()}/media", fields="id,timestamp,permalink,media_type", limit=5)
          lines = [f"{m['timestamp']}  {m['media_type']}  {m['permalink']}" for m in recent.get("data", [])]
          notice("Instagram 上の最近の投稿（新しい順）:\n" + ("\n".join(lines) or recent.get("error", "なし")))

          history = json.load(open("history.json", encoding="utf-8"))
          for h in history[-3:]:
              if not h.get("media_id"):
                  continue
              m = get(h["media_id"], fields="id,timestamp,permalink")
              state = m.get("permalink") or m.get("error", "見つかりません")
              notice(f"記録 {h['date']} {h['slot']}「{h['theme']}」→ {state}")
          PY
