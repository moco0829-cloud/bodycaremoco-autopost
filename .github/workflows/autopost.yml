name: Instagram 自動投稿

on:
  schedule:
    # 投稿は今は1日1回（夜 19:33）。2026-10-17 に Instagram に操作を制限されたため、アカウントが育つまで減らしている
    # （昼 12:30 の枠に戻すときは、check の ACTIVE_SLOTS を "noon night" にする）。
    # GitHub Actions の cron は UTC（日本時間 = UTC + 9 時間）で、混雑すると大きく遅れる。
    # 2026-11 には毎日 7 時間ほど遅れ、夕方の回が深夜に動いて夜の投稿が何日も出なかった。
    # そこで 9:23〜18:23 JST に 1 時間おきに仕掛け、何時間遅れても、どれかの回が投稿時刻の 3.5 時間前〜見送りの時刻
    # （夜なら 16:03〜21:00）のあいだに動けば、その回が画像と文章を作って投稿時刻まで待ってから投稿する。
    # それ以外の時刻に動いた回や、もう投稿が済んだあとの回は、何もせずに終わる（画像生成代はかからない）。
    # 区切りのいい時刻（毎時0分）は混みやすいので避ける。
    - cron: "23 0 * * *"   # 09:23 JST
    - cron: "23 1 * * *"   # 10:23 JST
    - cron: "23 2 * * *"   # 11:23 JST
    - cron: "23 3 * * *"   # 12:23 JST
    - cron: "23 4 * * *"   # 13:23 JST
    - cron: "23 5 * * *"   # 14:23 JST
    - cron: "23 6 * * *"   # 15:23 JST
    - cron: "23 7 * * *"   # 16:23 JST
    - cron: "23 8 * * *"   # 17:23 JST
    - cron: "23 9 * * *"   # 18:23 JST
  workflow_dispatch:
    inputs:
      slot:
        description: "投稿枠（空欄なら夜）"
        type: choice
        options: ["", noon, night]
        default: ""
      topic:
        description: "テーマの指定（空欄ならおまかせ）"
        type: string
        default: ""
      dry_run:
        description: "画像と文章を作るだけで、Instagram には投稿しない"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  check:
    # 定期実行は、Settings → Variables で AUTOPOST_ENABLED を true にするまで動かない
    # （試し実行で内容を確認してから、自動投稿を始めるため）。手動実行はいつでも動く
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPOST_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      slot: ${{ steps.check.outputs.slot }}
      post_at: ${{ steps.check.outputs.post_at }}
    steps:
      # 順番待ちのあいだに前の回が投稿していることがあるので、起動時点ではなく今の main を見る
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 今日の投稿が必要か確認
        id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          # 定期実行で投稿する枠（昼の枠を戻すときは "noon night" にし、上の cron の「#」も外す）
          ACTIVE_SLOTS: night
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=9)))
          today = now.strftime("%Y-%m-%d")
          # 15時より前に動いた回は昼 12:30 の枠、それ以降に動いた回は夜 19:33 の枠
          if os.environ["EVENT"] == "schedule":
              slot = "noon" if now.hour < 15 else "night"
          else:
              slot = os.environ.get("INPUT_SLOT") or "night"
          post_at, give_up = {"noon": ("12:30", 14), "night": ("19:33", 21)}[slot]
          name = {"noon": "昼", "night": "夜"}[slot]
          skip, reason = False, ""
          if os.environ["EVENT"] == "schedule":
              history = json.load(open("history.json", encoding="utf-8"))
              if any(h["date"] == today and h["slot"] == slot for h in history):
                  skip, reason = True, f"今日の{name}の投稿はもう済んでいます"
              elif now.hour >= give_up:
                  # 実行が大きく遅れたときは、時間外に投稿しないよう見送る
                  skip, reason = True, f"開始が {now:%H:%M} と遅すぎるので、今日の{name}の投稿は見送ります"
              elif slot not in os.environ["ACTIVE_SLOTS"].split():
                  # 前の日の夜の回が真夜中過ぎまで遅れると、止めている昼の枠の回とみなされてしまう。
                  # そのまま作ると、画像生成代がかかったうえに、待ち時間の上限（4時間）で止まるので見送る
                  skip, reason = True, f"{now:%H:%M} 開始。今は{name}の枠は止めているので、何もしません"
              else:
                  target = now.replace(hour=int(post_at[:2]), minute=int(post_at[3:]), second=0, microsecond=0)
                  if (target - now).total_seconds() > 3.5 * 3600:
                      # 投稿時刻まで待ちきれない（上限4時間）ほど早く始まったときは、作らずに後の回にまかせる
                      skip, reason = True, f"開始が {now:%H:%M} と早すぎるので、後の回にまかせます"
          print(reason or f"{now:%H:%M} 開始。{name}（{post_at}）の投稿を作ります")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\nslot={slot}\npost_at={post_at}\n")
          PY

  post:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 投稿時刻まで待つことがあるので長めにとる
    timeout-minutes: 240
    steps:
      # 順番待ちのあいだに前の回が投稿していることがあるので、起動時点ではなく今の main を見る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 日本語フォント（ゴシック体）を入れる
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: 文章と画像を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: python autopost.py generate --slot "${{ needs.check.outputs.slot }}" --topic "$TOPIC"

      - name: 画像をリポジトリに保存（Instagram が読める公開URLにするため）
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git commit -m "post: $(jq -r '.date + " " + .slot + " " + .theme' posts/latest.json)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 投稿時刻まで待つ
        if: github.event_name == 'schedule'
        env:
          POST_AT: ${{ needs.check.outputs.post_at }}
        run: |
          now=$(date +%s)
          target=$(TZ=JST-9 date -d "today $POST_AT" +%s)
          if [ "$now" -lt "$target" ]; then
            echo "$(( (target - now) / 60 )) 分待って、$POST_AT に投稿します"
            sleep $(( target - now ))
          else
            echo "$POST_AT を過ぎているので、すぐに投稿します"
          fi

      - name: Instagram に投稿
        if: ${{ !inputs.dry_run }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: python autopost.py publish

      - name: Facebook ページにも投稿
        if: ${{ !inputs.dry_run }}
        # Facebook 側で失敗しても、Instagram の投稿と履歴の保存は止めない
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: python autopost.py publish-facebook

      - name: 投稿履歴を保存
        if: ${{ !inputs.dry_run }}
        run: |
          git add history.json posts/latest.json
          git commit -m "history: $(jq -r '.media_id' posts/latest.json)"
          git push

      - name: 失敗を記録（同じ枠で作り直して投稿し直さないため）
        # Instagram に断られたあと、予備の回が何度も投稿し直すと、制限が強まったり画像生成代がむだになったりする。
        # 失敗した枠も「済み」として履歴に残し、その枠の残りの回は何もしないようにする
        if: ${{ failure() && steps.push.outcome == 'success' && !inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json
          latest = json.load(open("posts/latest.json", encoding="utf-8"))
          history = json.load(open("history.json", encoding="utf-8"))
          history.append({k: latest[k] for k in ("date", "slot", "theme", "images")} | {"failed": True})
          json.dump(history, open("history.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          git add history.json
          git commit -m "failed: $(jq -r '.date + " " + .slot + " " + .theme' posts/latest.json)"
          git pull --rebase
          git push
